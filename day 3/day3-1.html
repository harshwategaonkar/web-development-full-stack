<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Ordered List Types</title>
</head>
<body>

    <!-- Uppercase letters -->
    <ol type="A">
        <li>HTML Basics</li>
        <li>CSS Fundamentals</li>
        <li>JavaScript</li>
    </ol>

    <!-- Uppercase Roman numerals -->
    <ol type="I">
        <li>Phase One</li>
        <li>Phase Two</li>
    </ol>

    <!-- Start from 5 -->
    <ol start="5">
        <li>This item shows as number 5</li>
        <li>This item shows as number 6</li>
    </ol>

    <!-- Reversed order -->
    <ol reversed>
        <li>React (shows as 3)</li>
        <li>JavaScript (shows as 2)</li>
        <li>HTML (shows as 1)</li>
    </ol>

</body>
</html>
